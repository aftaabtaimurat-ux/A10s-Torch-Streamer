name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Gradle Environment
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.1.1

    - name: Compile Application Debug APK Fast
      run: |
        # --no-daemon stops background freezes
        # --parallel uses all processor cores to finish under 2 minutes
        gradle :app:assembleDebug --no-daemon --parallel --build-cache

    - name: Upload Finalized APK
      uses: actions/upload-artifact@v4
      with:
        name: torch-streamer-apk
        path: app/build/outputs/apk/debug/app-debug.apk
