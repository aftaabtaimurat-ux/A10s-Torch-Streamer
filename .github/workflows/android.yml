name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Android Command Line Utilities
      uses: android-actions/setup-android@v3

    - name: Generate Native Gradle Wrapper Files
      run: |
        # This initializes the official system environment binaries on the fly
        gradle wrapper --gradle-version 8.1.1
        chmod +x gradlew

    - name: Compile Debug APK Binary
      run: ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Upload Finished APK Installer
      uses: actions/upload-artifact@v4
      with:
        name: torch-streamer-apk
        path: app/build/outputs/apk/debug/app-debug.apk
