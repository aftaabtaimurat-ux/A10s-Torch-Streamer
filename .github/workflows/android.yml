name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Automatically Initialize and Run Gradle Compiler
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.1.1 # Dynamically downloads matching tools in cloud

    - name: Compile Debug APK Binary
      run: gradle assembleDebug --stacktrace

    - name: Extract and Upload APK Installer
      uses: actions/upload-artifact@v4
      with:
        name: torch-streamer-apk
        path: app/build/outputs/apk/debug/app-debug.apk
