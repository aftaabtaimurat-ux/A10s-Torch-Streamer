buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath 'com.android.tools.build:gradle:8.1.1' }
}
plugins {
    id 'com.android.application' version '8.1.1' id 'org.jetbrains.kotlin.android' version '1.8.10'
}
android {
    namespace 'com.example.torchstreamer'
    compileSdk 33
    defaultConfig {
        applicationId "com.example.torchstreamer"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }
}
repositories { google(); mavenCentral() }
dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
}
